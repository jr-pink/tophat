<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
/* the one shared element: the figure caption (identical in all six widgets) */
:root{--cap-bg:#f7f6f2;--cap-ink:#3d3b36;--cap-label:#8a867b;--cap-rule:#d8d5cb}
@media (prefers-color-scheme:dark){:root{--cap-bg:#171716;--cap-ink:#bdb9ae;--cap-label:#7d796f;--cap-rule:#32312d}}
html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}*{box-sizing:border-box}
figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
figcaption{flex:none;padding:7px 14px 9px;border-top:1px solid var(--cap-rule);background:var(--cap-bg);color:var(--cap-ink);font:12px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
figcaption b{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;color:var(--cap-label)}
/* this figure: the memory viewer itself, framed; below 720 px it is scaled down whole (laid out at 720 wide), never reflowed */
body{background:#efe6cc}
.art{position:relative;flex:1;min-height:0;overflow:hidden}
#v{position:absolute;left:0;top:0;width:720px;height:100%;border:0;transform-origin:0 0;background:#efe6cc}
</style></head><body>
<figure>
<div class="art" id="art"><iframe id="v" title="the memory graph of this demo" src="/graph#mode=plain" loading="eager" referrerpolicy="no-referrer"></iframe></div>
<figcaption><b>Fig. 1</b>The memory behind this site, live: a dot per entity, a line where notes mention two together. Click a dot to read its page and the notes behind it.</figcaption>
</figure>
<script>
(()=>{const art=document.getElementById('art'),v=document.getElementById('v'),MIN=720;
function fit(){const w=art.clientWidth,h=art.clientHeight;if(!w||!h)return;const s=Math.min(1,w/MIN),iw=s<1?MIN:w;v.style.width=iw+'px';v.style.height=(h/s)+'px';v.style.transform=s<1?'scale('+s+')':'none'}
new ResizeObserver(fit).observe(art);fit();
})();
</script></body></html>
