<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
/* the one shared element: the figure caption (identical in all six widgets) */
:root{--cap-bg:#f7f6f2;--cap-ink:#3d3b36;--cap-label:#8a867b;--cap-rule:#d8d5cb}
@media (prefers-color-scheme:dark){:root{--cap-bg:#171716;--cap-ink:#bdb9ae;--cap-label:#7d796f;--cap-rule:#32312d}}
html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}*{box-sizing:border-box}
figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
figcaption{flex:none;padding:7px 14px 9px;border-top:1px solid var(--cap-rule);background:var(--cap-bg);color:var(--cap-ink);font:12px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
figcaption b{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;color:var(--cap-label)}
/* this figure: ink on paper, monospace; one colour per note, light gray for what the viewer cannot read */
:root{--bg:#fbfaf6;--ink:#1c1b19;--dim:#77736a;--line:#d9d5c9;--sheet:#ffffff;--c1:#2f5d8a;--c2:#c2410c;--c3:#8e3b7d;--gline:#d2cfc4;--gfill:#ebe9e1;--gtxt:#aaa699;--gbar:#dedbd0;--ease:cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--ink:#e9e6dd;--dim:#8f8b80;--line:#34332f;--sheet:#1a1a18;--c1:#7fb0e0;--c2:#ff7a45;--c3:#d98bc8;--gline:#56544d;--gfill:#242320;--gtxt:#7a776e;--gbar:#2c2b27}}
body{background:var(--bg);color:var(--ink);font:11px/1.4 ui-monospace,"SF Mono",Menlo,monospace}
.art{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:7px 12px;border-bottom:1px solid var(--line)}
.bar .l{color:var(--dim)}
.seg{display:flex}
.seg button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);margin-left:-1px;padding:3px 12px;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease)}
.seg button:first-child{margin-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);position:relative}
.seg button:focus-visible{outline:2px solid var(--c2);outline-offset:1px;position:relative;z-index:2}
.leg{margin-left:auto;display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--dim);font-size:10.5px}
.leg span{display:inline-flex;align-items:center;gap:6px;transition:opacity .22s var(--ease)}
.leg span.off{opacity:.4}
.leg svg{width:26px;height:12px;flex:none;overflow:visible}
svg#g{flex:1;min-height:0;width:100%;display:block;font-family:ui-monospace,"SF Mono",Menlo,monospace}
#g text{fill:var(--ink);font-size:10px}
.t{transition:fill .25s var(--ease),stroke .25s var(--ease),opacity .25s var(--ease),fill-opacity .25s var(--ease)}
.f1{--c:var(--c1)}.f2{--c:var(--c2)}.f3{--c:var(--c3)}
.hull{fill:var(--c);fill-opacity:.07;stroke:var(--c);stroke-width:1.1}
.hull.f1{fill-opacity:.04;stroke-width:.9}
.hull.hid{fill:var(--gfill);fill-opacity:.5;stroke:var(--gline);stroke-dasharray:4 3}
.lead{stroke:var(--c);stroke-width:1;fill:none}
.lead.hid{stroke:var(--gline);stroke-dasharray:2 3}
.bd{fill:var(--c)}.bd.hid{fill:var(--gline)}
.bdt{fill:var(--bg)!important;font-weight:700;font-size:9.5px!important}
.card{fill:var(--sheet);stroke:var(--c);stroke-width:1}
.card.hid{stroke:var(--gline);stroke-dasharray:4 3}
.hd{fill:var(--c)!important;font-size:8.5px!important;letter-spacing:.02em}
.hd.hid{fill:var(--gtxt)!important}
.ln{opacity:1}.ln.hid{opacity:0}
.bars{opacity:0}.bars.hid{opacity:1}
.bars rect{fill:var(--gbar)}
.lk{opacity:0;fill:none;stroke:var(--gtxt);stroke-width:1.2}.lk rect{fill:var(--gtxt);stroke:none}.lk.hid{opacity:1}
.rule{stroke:var(--line);stroke-width:1}
.dot{fill:var(--ink);stroke:var(--ink);stroke-width:1.2}.dot.hid{fill:var(--bg);stroke:var(--gline);stroke-dasharray:none}
.ring{fill:none;stroke:var(--ink);stroke-width:1;opacity:0}.me .ring{opacity:1}
.nl{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.nl.hid{fill:var(--gtxt)!important}.me .nl{font-weight:700}
@media (max-width:560px){.bar{padding:6px 10px;gap:3px 10px}.seg button{padding:3px 10px}.leg{margin-left:0;flex-basis:100%;gap:1px 12px;font-size:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body data-shots="maya|button[data-k=maya]|click;jon|button[data-k=jon]|click">
<figure>
<div class="art">
 <div class="bar"><span class="l">view as</span><div class="seg" id="seg" role="group" aria-label="whose view"></div><div class="leg" id="leg"></div></div>
 <svg id="g" role="img"></svg>
</div>
<figcaption><b>Fig. 6</b>Three notes, each readable by a different set of people. A note you cannot read stays drawn in gray: as you, the pastéis fact; as jon, the surprise party. Switch the viewer to compare. This is a diagram of the sharing model, not a screenshot of the app.</figcaption>
</figure>
<script>
/* five nodes on a circle (degrees, counter-clockwise from the right): the surprise party leftmost, the trip on the right */
const NODES={surprise:{l:'surprise party',a:162,topic:1},trip:{l:'lisbon trip',a:18,topic:1},you:{l:'you',a:90},maya:{l:'maya',a:234},jon:{l:'jon',a:306}};
/* each note is a hyperedge over the nodes it mentions, and its readers are a separate, per-note list */
const FACTS=[
 {k:'note',text:'trip planning: flights Mar 12-19, staying in Alfama',on:['you','maya','jon','trip'],readers:['you','maya','jon']},
 {k:'fact',text:'maya and jon really want to try past\u00e9is de nata at Past\u00e9is de Bel\u00e9m',on:['maya','jon','trip'],readers:['maya','jon']},
 {k:'note',text:'surprise party for jon: Sat after we land, Time Out Market',on:['you','maya','surprise'],readers:['you','maya']}
];
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('g');
let who='you';
const seg=document.getElementById('seg'),leg=document.getElementById('leg');
for(const k of ['you','maya','jon']){const b=document.createElement('button');b.type='button';b.textContent=k;b.dataset.k=k;b.onclick=()=>{who=k;apply()};seg.appendChild(b)}
leg.innerHTML='<span id="lv"><svg viewBox="0 0 26 12"><rect x="1" y="1" width="24" height="10" rx="5" fill="var(--c2)" fill-opacity=".12" stroke="var(--c2)"/></svg><i id="lvt"></i></span><span id="lh"><svg viewBox="0 0 26 12"><rect x="1" y="1" width="24" height="10" rx="5" fill="var(--gfill)" fill-opacity=".6" stroke="var(--gline)" stroke-dasharray="4 3"/></svg><i id="lht"></i></span>';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const wrap=(t,n)=>{const out=[];let cur='';for(const w of t.split(' ')){if(cur&&(cur+' '+w).length>n){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}if(cur)out.push(cur);return out};
const lock=(x,y)=>`<g class="lk t" transform="translate(${x} ${y})"><rect x="0" y="3.4" width="7" height="5" rx="1"/><path d="M1.5 3.4V2.4a2 2 0 0 1 4 0v1"/></g>`;
/* the outline of a convex polygon grown by pad: straight offsets joined by arcs */
function hull(P,pad){
  const c=[P.reduce((s,p)=>s+p[0],0)/P.length,P.reduce((s,p)=>s+p[1],0)/P.length];
  P=P.slice().sort((a,b)=>Math.atan2(a[1]-c[1],a[0]-c[0])-Math.atan2(b[1]-c[1],b[0]-c[0]));
  const N=P.map((p,i)=>{const q=P[(i+1)%P.length],dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1;let n=[dy/L,-dx/L];if(n[0]*((p[0]+q[0])/2-c[0])+n[1]*((p[1]+q[1])/2-c[1])<0)n=[-n[0],-n[1]];return n});
  let d='';
  P.forEach((p,i)=>{const j=(i+1)%P.length,q=P[j],a=N[i],b=N[j],sw=a[0]*b[1]-a[1]*b[0]>0?1:0;
    d+=(i?'L':'M')+(p[0]+a[0]*pad)+' '+(p[1]+a[1]*pad)+'L'+(q[0]+a[0]*pad)+' '+(q[1]+a[1]*pad)+`A${pad} ${pad} 0 0 ${sw} ${q[0]+b[0]*pad} ${q[1]+b[1]*pad}`});
  return d+'Z';
}
function build(){
  const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const FS=10,CW=FS*.61,LH=13;
  const wide=W>=640;
  let R,cx,cy,pads,cards=[],s='',pad;
  const rad=a=>a*Math.PI/180;
  /* a regular pentagon, left and right symmetric: you on top, the surprise party upper left, the trip upper right, maya lower left, jon lower right.
     Hull 1 (trip planning) is everyone but the surprise party, hull 2 (the pasteis fact) is maya, jon and the trip, hull 3 (the surprise party) is you, maya and the surprise. */
  const ANCH=[[.15,-.2],[.3,.45],[-.55,-.15]];
  if(wide){
    const Wc=Math.min(W-16,940);pad=14;pads=[14,7,7];
    R=Math.min((H-2*(pad+18))/1.809,190,(Wc/2-165-14-pad)/.951);
    const cw=Math.min(216,Wc/2-.951*R-pad-14),n=Math.floor((cw-20)/CW);
    cx=W/2;cy=H/2+.0955*R;
    const mk=(f,x)=>{const L=wrap(f.text,n);return {x,w:cw,L,h:31+(L.length-1)*LH+9}};
    const A=ANCH.map(a=>[cx+a[0]*R,cy+a[1]*R]);
    const rx=cx+.951*R+pad+14,lx=cx-.951*R-pad-14-cw;
    const c1=mk(FACTS[0],rx),c2=mk(FACTS[1],rx),c3=mk(FACTS[2],lx);
    c1.y=Math.max(6,cy-.72*R-c1.h/2);c3.y=c1.y;c2.y=Math.max(c1.y+c1.h+14,cy+.5*R-c2.h/2);
    c3.ax=c3.x+c3.w;
    cards=[c1,c2,c3];cards.forEach((c,i)=>{c.A=A[i];c.lead=1});
  }else{
    pad=10;pads=[10,5,5];
    const n=Math.floor((W-16-26)/CW),rows=FACTS.map(f=>{const L=wrap(f.text,n);return {L,h:L.length*LH+9}});
    const rh=rows.reduce((a,r)=>a+r.h,0)+6;
    R=Math.max(44,Math.min((H-rh-2*(pad+18))/1.809,(W-12-2*pad-14-158)/1.902));
    cx=W/2+13;cy=(H-rh)/2+.0955*R;
    const A=ANCH.map(a=>[cx+a[0]*R,cy+a[1]*R]);
    let y=H-rh+2;cards=rows.map((r,i)=>{const c={x:8,y,w:W-16,L:r.L,h:r.h,row:1,A:A[i]};y+=r.h;return c});
  }
  const P=k=>[cx+R*Math.cos(rad(NODES[k].a)),cy-R*Math.sin(rad(NODES[k].a))];
  /* the three hyperedges as padded hulls, largest first */
  FACTS.forEach((f,i)=>{s+=`<path class="hull t f${i+1}" data-f="${i}" d="${hull(f.on.map(P),pads[i])}"/>`});
  if(wide)cards.forEach((c,i)=>{const [ax,ay]=c.A,ex=i===2?c.ax:c.x,ey=c.y+c.h/2;s+=`<path class="lead t f${i+1}" data-f="${i}" d="M${ax} ${ay}L${ex} ${ey}"/>`});
  /* nodes */
  for(const [k,v] of Object.entries(NODES)){const [x,y]=P(k);let lx=x,ly=y,an='middle',lk='';
    const o=pads[0]+6;
    if(k==='you')ly=y-o+1;else if(k==='maya'||k==='jon')ly=y+o+7;
    else if(k==='surprise'){lx=x-pads[2]-7;ly=y+3.5;an='end';lk=lock(lx-v.l.length*CW-11,ly-8.5)}
    else{lx=x+pads[1]+7;ly=y+3.5;an='start'}
    s+=`<g data-n="${k}"><circle class="ring" cx="${x}" cy="${y}" r="9.5"/><circle class="dot t" cx="${x}" cy="${y}" r="5"/><text class="nl t" x="${lx}" y="${ly}" text-anchor="${an}">${v.l}</text>${lk}</g>`}
  /* hub dots and the note cards */
  cards.forEach((c,i)=>{const f=FACTS[i],[ax,ay]=c.A;
    s+=`<g class="f${i+1}"><circle class="bd t" data-f="${i}" cx="${ax}" cy="${ay}" r="7.5"/><text class="bdt" x="${ax}" y="${ay+3.4}" text-anchor="middle">${i+1}</text></g>`;
    const bx=c.row?c.x+7.5:c.x+10,tx=c.row?c.x+24:c.x+10,ty=c.row?c.y+LH-2+3:c.y+31;
    s+=`<g class="f${i+1}">`;
    if(c.row){s+=`<line class="rule" x1="${c.x}" x2="${c.x+c.w}" y1="${c.y}" y2="${c.y}"/><circle class="bd t" data-f="${i}" cx="${bx}" cy="${c.y+LH+1}" r="7.5"/><text class="bdt" x="${bx}" y="${c.y+LH+4.4}" text-anchor="middle">${i+1}</text>`+lock(c.x+c.w-12,c.y+LH-4).replace('class="lk t"','class="lk t" data-f="'+i+'"')}
    else{s+=`<rect class="card t" data-f="${i}" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}"/><circle class="bd t" data-f="${i}" cx="${c.x+13}" cy="${c.y+13}" r="7.5"/><text class="bdt" x="${c.x+13}" y="${c.y+16.4}" text-anchor="middle">${i+1}</text>
     <text class="hd t" data-f="${i}" x="${c.x+25}" y="${c.y+16}">${f.k} \u00b7 for ${f.readers.join(', ')}</text>${lock(c.x+c.w-16,c.y+8).replace('class="lk t"','class="lk t" data-f="'+i+'"')}`}
    const txy=c.row?c.y+LH+3:ty;
    s+=`<g class="ln t" data-f="${i}">${c.L.map((l,j)=>`<text x="${tx}" y="${txy+j*LH}">${esc(l)}</text>`).join('')}</g>`;
    s+=`<g class="bars t" data-f="${i}">${c.L.map((l,j)=>`<rect x="${tx}" y="${txy+j*LH-7}" width="${Math.max(18,l.length*CW-4)}" height="7" rx="3"/>`).join('')}</g></g>`;
  });
  svg.innerHTML=s;apply();
}
function apply(){
  const ok=i=>FACTS[i].readers.includes(who);
  svg.querySelectorAll('[data-f]').forEach(e=>e.classList.toggle('hid',!ok(+e.dataset.f)));
  svg.querySelectorAll('[data-n]').forEach(g=>{const k=g.dataset.n,hid=!!NODES[k].topic&&!FACTS.some((f,i)=>f.on.includes(k)&&ok(i));g.classList.toggle('me',k===who);g.querySelectorAll('.dot,.nl,.lk').forEach(e=>e.classList.toggle('hid',hid))});
  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===who));
  const hidn=FACTS.filter((f,i)=>!ok(i)).length;
  document.getElementById('lvt').textContent='visible to '+who;document.getElementById('lht').textContent='exists, hidden from '+who;
  document.getElementById('lh').classList.toggle('off',!hidn);
  svg.setAttribute('aria-label',`Five nodes: surprise party, maya, jon, lisbon trip, you. Viewed as ${who}: ${FACTS.length-hidn} of 3 notes readable, ${hidn} hidden.`);
}
let raf=0,lw=0,lh=0;build();new ResizeObserver(()=>{if(svg.clientWidth===lw&&svg.clientHeight===lh)return;lw=svg.clientWidth;lh=svg.clientHeight;cancelAnimationFrame(raf);raf=requestAnimationFrame(build)}).observe(svg);
</script></body></html>
