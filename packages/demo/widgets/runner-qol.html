<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
/* the one shared element: the figure caption (identical in all six widgets) */
:root{--cap-bg:#f7f6f2;--cap-ink:#3d3b36;--cap-label:#8a867b;--cap-rule:#d8d5cb}
@media (prefers-color-scheme:dark){:root{--cap-bg:#171716;--cap-ink:#bdb9ae;--cap-label:#7d796f;--cap-rule:#32312d}}
html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}*{box-sizing:border-box}
figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
figcaption{flex:none;padding:7px 14px 9px;border-top:1px solid var(--cap-rule);background:var(--cap-bg);color:var(--cap-ink);font:12px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
figcaption b{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;color:var(--cap-label)}
/* this figure: eight skeleton mocks (a to h) of the chat's quality-of-life features, drawn here in SVG: grey bars for text, plain shapes for bubbles, composers and sidebars; the only words are each feature's own label. Static (no animation); easing and no bounce; reduced motion shows the finished frame */
:root{--bg:#fbfaf6;--card:#fffefb;--line:#d9d5c9;--g:#e8e4d9;--gd:#d6d1c2;--hint:#8a867b;--rose:#e6a0a6;--rt:#b45c6e}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--card:#191918;--line:#34332f;--g:#2b2a26;--gd:#3c3a34;--hint:#7d796f;--rose:#e6a0a6;--rt:#e6a0a6}}
html,body{height:auto}body{overflow:visible;background:var(--bg)}figure{flex:none}
.art{flex:none;padding:6px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.art svg{display:block;width:100%;height:auto;aspect-ratio:160/146}
/* three columns from 521 px of frame, two below it; a tile always scales whole (viewBox), it never reflows. At 700 px a tile is about 221 px wide, so its 8.5 px labels read at about 11.7 px. The page is as tall as its content and tells the chat so ({tophatFigure:'height'}) */
.card{fill:var(--card);stroke:var(--line)}
.g{fill:var(--g)}.gd{fill:var(--gd)}.rf{fill:var(--rose)}.rt{fill:var(--rt)}
.rl{fill:none;stroke:var(--rt);stroke-width:1}.rld{fill:none;stroke:var(--rt);stroke-width:1;stroke-dasharray:3 2.5}
.rw{fill:var(--rose);fill-opacity:.16}
.ln{fill:none;stroke:var(--line);stroke-width:1}.lg{stroke:var(--gd);stroke-width:1;fill:none}
.sb{fill:var(--g);fill-opacity:.55}
text{font:600 8.5px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.03em}
.lab{fill:var(--rt)}.sm{font-size:7.5px}.dim{fill:var(--hint);font-weight:500}
/* below 520 px of frame: two columns (4 x 2), labels bumped so they read at 10 px or more */
@media (max-width:520px){.art{grid-template-columns:repeat(2,1fr)}text{font-size:10.5px}text.sm{font-size:10px}}
.fo{opacity:0}.rise{transform:translateY(-40px)}.fold{transform:translateY(-14px)}.collapse{opacity:0}.knob{transform:translateX(60px)}.stretch{transform:none}.pane{transform:none}.press{opacity:.4}.rf.run{opacity:1}
</style></head><body>

<figcaption><b>Fig. 2</b>a. compaction happens in the background so you never have to wait, b. instant-steer messages push the current turn to background so you don't lose progress when steering, c. chats proactively propose responses to inbound requests, d. powerful inbox tools like auto-routed folders, set aside, snooze, archive, e. poweruser tools like splits, keybinds (cmd-shift-enter to create chat in new pane), f. harness hooks that keep agents on track, g. interactive widgets, h. side chats for follow-up questions, etc, fully customizable via self-modification.</figcaption>
