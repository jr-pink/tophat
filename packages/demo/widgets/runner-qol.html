<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
/* the one shared element: the figure caption (identical in all six widgets) */
:root{--cap-bg:#f7f6f2;--cap-ink:#3d3b36;--cap-label:#8a867b;--cap-rule:#d8d5cb}
@media (prefers-color-scheme:dark){:root{--cap-bg:#171716;--cap-ink:#bdb9ae;--cap-label:#7d796f;--cap-rule:#32312d}}
html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}*{box-sizing:border-box}
figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
figcaption{flex:none;padding:7px 14px 9px;border-top:1px solid var(--cap-rule);background:var(--cap-bg);color:var(--cap-ink);font:12px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
figcaption b{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;color:var(--cap-label)}
/* this figure: eight real screenshots of the app (a to h, four over four), the page's own letters on each; click one to see it large */
:root{--bg:#fbfaf6;--line:#d9d5c9;--chip:#1c1b19;--chipfg:#fbfaf6;--hint:#8a867b}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--line:#34332f;--chip:#e9e6dd;--chipfg:#131312;--hint:#7d796f}}
body{background:var(--bg)}
.art{position:relative;flex:1;min-height:0;overflow:auto;padding:9px 12px 6px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.r{display:flex;gap:6px;width:100%}
.t{position:relative;flex:var(--ar) 1 0;min-width:0;aspect-ratio:var(--ar);border:1px solid var(--line);overflow:hidden;background:var(--bg);padding:0;margin:0;cursor:zoom-in;font:inherit;color:inherit}
.t picture,.t img{display:block;width:100%;height:100%}
.t img{object-fit:cover;object-position:left top}
.t:focus-visible{outline:2px solid var(--chip);outline-offset:1px}
.lb{position:absolute;right:4px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--chip);color:var(--chipfg);font:700 10px/15px ui-monospace,Menlo,monospace;text-align:center}
.keys{position:absolute;right:7%;bottom:22%}
.pill{display:inline-block;font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;padding:5px 9px 5px 11px;border-radius:999px;background:var(--chip);color:var(--chipfg);box-shadow:0 1px 0 rgba(0,0,0,.35);white-space:nowrap}
.hint{flex:none;text-align:right;font:10px/1 ui-monospace,Menlo,monospace;color:var(--hint);letter-spacing:.04em;padding-top:1px}
.lbx{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:10px;background:color-mix(in srgb,var(--bg) 92%,transparent);cursor:zoom-out}
.lbx.on{display:flex}
.lbx figure{margin:0;max-width:100%;max-height:100%;display:block}
.lbx img{display:block;max-width:100%;max-height:calc(100vh - 20px);border:1px solid var(--line);background:var(--bg)}
@media (max-width:560px){
  .art{padding:8px;gap:6px}.r{display:contents}.art{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  .t{flex:none;width:calc(50% - 3px)}.t[data-n=e],.t[data-n=f],.t[data-n=h]{width:100%}.hint{width:100%}
}
</style></head><body>
