<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
/* the one shared element: the figure caption (identical in all six widgets) */
:root{--cap-bg:#f7f6f2;--cap-ink:#3d3b36;--cap-label:#8a867b;--cap-rule:#d8d5cb}
@media (prefers-color-scheme:dark){:root{--cap-bg:#171716;--cap-ink:#bdb9ae;--cap-label:#7d796f;--cap-rule:#32312d}}
html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}*{box-sizing:border-box}
figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
figcaption{flex:none;padding:7px 14px 9px;border-top:1px solid var(--cap-rule);background:var(--cap-bg);color:var(--cap-ink);font:12px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
figcaption b{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;color:var(--cap-label)}
/* this figure: five real screenshots of the app, labelled a to e, three over two */
:root{--bg:#fbfaf6;--line:#d9d5c9;--chip:#1c1b19;--chipfg:#fbfaf6}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--line:#34332f;--chip:#e9e6dd;--chipfg:#131312}}
body{background:var(--bg)}
.art{flex:1;min-height:0;overflow:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.r{display:flex;gap:8px;width:100%;justify-content:center}
.t{position:relative;border:1px solid var(--line);overflow:hidden;background:var(--bg);flex:none}
.t picture,.t img{display:block;width:100%;height:100%}
.t img{object-fit:cover;object-position:left top}
.ta{width:29%;aspect-ratio:1.31}.tb{width:35%;aspect-ratio:1.57}.tc{width:33%;aspect-ratio:1.49}
.td{width:28%;aspect-ratio:1.31}.te{width:44%;aspect-ratio:1.97}
.lb{position:absolute;right:5px;top:5px;width:15px;height:15px;border-radius:50%;background:var(--chip);color:var(--chipfg);font:700 10px/15px ui-monospace,Menlo,monospace;text-align:center}
.keys{position:absolute;right:6px;bottom:6px;display:flex;gap:3px}
kbd{font:600 11px/1 ui-monospace,Menlo,monospace;min-width:19px;height:19px;padding:0 4px;display:grid;place-items:center;border-radius:4px;background:var(--chip);color:var(--chipfg);box-shadow:0 1px 0 rgba(0,0,0,.35)}
@media (max-width:560px){
  .art{padding:8px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:6px}.r{display:contents}
  .ta,.tb,.tc,.td{width:calc(50% - 3px)}.te{width:78%}
  .ta,.tc{aspect-ratio:1.31}.tb,.td{aspect-ratio:1.31}
}
</style></head><body>
