<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
/* the one shared element: the figure caption (identical in all six widgets) */
:root{--cap-bg:#f7f6f2;--cap-ink:#3d3b36;--cap-label:#8a867b;--cap-rule:#d8d5cb}
@media (prefers-color-scheme:dark){:root{--cap-bg:#171716;--cap-ink:#bdb9ae;--cap-label:#7d796f;--cap-rule:#32312d}}
html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}*{box-sizing:border-box}
figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
figcaption{flex:none;padding:7px 14px 9px;border-top:1px solid var(--cap-rule);background:var(--cap-bg);color:var(--cap-ink);font:12px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
figcaption b{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;color:var(--cap-label)}
/* this figure: a day as a timeline, ink on manila */
:root{--bg:#ede3c6;--ink:#1d1a14;--dim:#76704f;--rule:#cdc29f}
@media (prefers-color-scheme:dark){:root{--bg:#15130e;--ink:#eadfc2;--dim:#948b6c;--rule:#33301f}}
body{background:var(--bg);color:var(--ink);font:11px/1.3 "American Typewriter","Courier New",Courier,monospace}
.art{flex:1;min-height:0;position:relative}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
text{fill:var(--ink);font:11px "American Typewriter","Courier New",Courier,monospace}
text.d{fill:var(--dim)}
.tk{stroke:var(--ink);stroke-width:1.6}
.tk.m{stroke:var(--dim);stroke-width:1.2}
.bar{fill:url(#hatch);stroke:var(--ink);stroke-width:1}
.base{stroke:var(--rule);stroke-width:1;stroke-dasharray:1 3}
.axis{stroke:var(--ink);stroke-width:1}
.gl{stroke:var(--rule);stroke-width:1}
.ph{stroke:var(--ink);stroke-width:1}
#re{position:absolute;right:10px;top:6px;font:inherit;color:var(--dim);background:none;border:0;border-bottom:1px solid var(--dim);padding:0;cursor:pointer}
#re:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<figure>
<div class="art" id="art"><svg id="s" role="img" aria-label="one day of context arriving from each source"></svg><button id="re" type="button">replay</button></div>
<figcaption><b>Fig. 4</b>One day of context arriving, source by source (an illustration). Each tick is a record entering memory with its source attached; the hatched bars are continuous capture that the full system has and the public repo does not.</figcaption>
</figure>
<script>
/* [label, short label, kind, data]: ticks are hours of the day a record arrives; bars are [from, to] spans of capture */
const PUB=[
 ['Gmail','Gmail','t',[7.2,8.9,9.4,11.1,13.5,15.2,16.8,18.4,21.0]],
 ['IMAP mailboxes','IMAP','t',[8.1,12.3,17.6]],
 ['iMessage','iMessage','t',[7.8,9.0,9.1,12.6,12.7,12.9,15.5,18.9,19.0,20.5,22.1]],
 ['Beeper chats','Beeper','t',[8.5,10.2,10.3,13.8,17.2,17.3,20.8,21.7]],
 ['Apple Contacts, Calendar, Notes','Apple','t',[6.0,9.9,14.0,18.0,22.0]],
 ['REST APIs','REST','t',[3,6,9,12,15,18,21]],
 ['file drop','files','t',[10.7,16.4]],
 ['webhook','webhook','t',[7.1,11.8,12.0,14.6,19.7]]
];
const FULL=[
 ['location','location','b',[[0,8],[8.4,12.2],[12.6,17.9],[18.3,24]]],
 ['screen recording','screen','b',[[9,12],[13,17.5],[20,22]]],
 ['all-day audio','audio','b',[[7.5,12.1],[12.6,23]]]
];
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('s');
const el=(n,a,t,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;(p||svg).appendChild(e);return e};
const total=PUB.reduce((n,r)=>n+r[3].length,0);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let raf=0,clipRect,phLine,cnt,x0,x1,allTicks=[],t0=0;
const DUR=6500;
function build(){
  cancelAnimationFrame(raf);svg.innerHTML='';allTicks=[];
  const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const narrow=W<560,lw=narrow?58:178;x0=lw+8;x1=W-(narrow?12:20);
  const defs=el('defs',{});
  const pat=el('pattern',{id:'hatch',width:5,height:5,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},null,defs);
  el('line',{x1:0,y1:0,x2:0,y2:5,stroke:'var(--ink)','stroke-width':1.2},null,pat);
  const cp=el('clipPath',{id:'rev'},null,defs);clipRect=el('rect',{x:0,y:0,width:0,height:H},null,cp);
  const nrows=PUB.length+FULL.length,head=15,top=narrow?10:12,axisH=18,memH=34;
  const rh=Math.min(21,(H-top-axisH-memH-head*2-6)/nrows);
  const X=h=>x0+(x1-x0)*h/24;
  let y=top;
  const group=(txt)=>{el('text',{x:6,y:y+10,class:'d'},txt);el('line',{x1:6,x2:W-6,y1:y+13,y2:y+13,class:'gl'});y+=head};
  group('in the public repo');
  const rev=el('g',{'clip-path':'url(#rev)'});
  const row=(r,i)=>{const cy=y+rh/2;
    el('text',{x:6,y:cy+4},narrow?r[1]:r[0]);
    el('line',{x1:x0,x2:x1,y1:cy,y2:cy,class:'base'});
    if(r[2]==='t')for(const h of r[3]){el('line',{x1:X(h),x2:X(h),y1:cy-6,y2:cy+6,class:'tk'},null,rev);allTicks.push(h)}
    else for(const [a,b] of r[3])el('rect',{x:X(a),y:cy-5,width:Math.max(1,X(b)-X(a)),height:10,class:'bar'},null,rev);
    y+=rh};
  PUB.forEach(row);
  y+=2;group('full system only');
  FULL.forEach(row);
  y+=4;
  /* the memory row: every record lands here, once, whatever its source */
  const my=y+memH/2+4;
  el('line',{x1:6,x2:W-6,y1:y,y2:y,class:'gl'});
  el('text',{x:6,y:my+4},narrow?'memory':'memory (all of it)');
  el('line',{x1:x0,x2:x1,y1:my+2,y2:my+2,class:'base'});
  for(const h of allTicks)el('line',{x1:X(h),x2:X(h),y1:my-4,y2:my+8,class:'tk m'},null,rev);
  cnt=el('text',{x:x0,y:my-10,class:'d'},'0 records');
  const axisY=H-axisH+2;
  el('line',{x1:x0,x2:x1,y1:axisY,y2:axisY,class:'axis'});
  [0,6,12,18,24].forEach(h=>{el('line',{x1:X(h),x2:X(h),y1:axisY,y2:axisY+4,class:'axis'});el('text',{x:X(h),y:axisY+14,'text-anchor':h===0?'start':h===24?'end':'middle',class:'d'},String(h).padStart(2,'0')+':00')});
  phLine=el('line',{x1:x0,x2:x0,y1:top+head-2,y2:axisY,class:'ph'});
  svg._X=X;
  if(reduce){frame(1)}else start();
}
function frame(p){
  const hour=24*p,x=x0+(x1-x0)*p;clipRect.setAttribute('width',x);phLine.setAttribute('x1',x);phLine.setAttribute('x2',x);
  const n=allTicks.filter(h=>h<=hour).length;cnt.textContent=`${n} record${n===1?'':'s'}`+(p>=1?' from public sources':'');
  phLine.style.opacity=p>=1?0:1;
}
function start(){cancelAnimationFrame(raf);t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/DUR);frame(p);if(p<1)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
document.getElementById('re').onclick=()=>{reduce?frame(1):start()};
build();new ResizeObserver(()=>{build()}).observe(svg);
</script></body></html>
