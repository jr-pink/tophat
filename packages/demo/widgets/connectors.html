<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
/* the one shared element: the figure caption (identical in all six widgets) */
:root{--cap-bg:#f7f6f2;--cap-ink:#3d3b36;--cap-label:#8a867b;--cap-rule:#d8d5cb}
@media (prefers-color-scheme:dark){:root{--cap-bg:#171716;--cap-ink:#bdb9ae;--cap-label:#7d796f;--cap-rule:#32312d}}
html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}*{box-sizing:border-box}
figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
figcaption{flex:none;padding:7px 14px 9px;border-top:1px solid var(--cap-rule);background:var(--cap-bg);color:var(--cap-ink);font:12px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif}
figcaption b{font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;margin-right:8px;color:var(--cap-label)}
/* this figure: connectors converge into a small memory, the agent reads and writes it, actions diverge from the agent; ink on manila, the app icons carry the colour */
:root{--bg:#f3ecd8;--ink:#1d1a14;--dim:#7a7456;--arc:#b4a97f;--card:#f9f4e4;--acc:#b45c6e;--ibd:rgba(29,26,20,.22)}
@media (prefers-color-scheme:dark){:root{--bg:#15130e;--ink:#eadfc2;--dim:#948b6c;--arc:#4d4731;--card:#201d15;--acc:#e6a0a6;--ibd:rgba(234,223,194,.25)}}
body{background:var(--bg);color:var(--ink);font:11px/1.3 "American Typewriter","Courier New",Courier,monospace}
.art{flex:1;min-height:0;position:relative}
svg#s{position:absolute;inset:0;width:100%;height:100%;display:block}
text{fill:var(--ink);font:10.5px "American Typewriter","Courier New",Courier,monospace}
text.d{fill:var(--dim)}
text.h{fill:var(--dim);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
text.ha{fill:var(--acc);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.arc{fill:none;stroke:var(--arc);stroke-width:1}
.pk{fill:var(--acc)}
.ib{fill:none;stroke:var(--ibd);stroke-width:1}
.bx{fill:var(--acc);fill-opacity:.07;stroke:var(--acc);stroke-width:1.4}
.ag{fill:var(--card);stroke:var(--acc);stroke-width:1.4}
.ar{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lk{stroke:var(--dim);stroke-width:.8;opacity:.8}
.nd{fill:var(--ink)}
.pg{fill:var(--card);stroke:var(--ink);stroke-width:1}
.br{fill:var(--dim)}
.sb{fill:var(--acc);fill-opacity:.14}
.cb{fill:none;stroke:var(--dim);stroke-width:1}
.wn{fill:var(--card);stroke:var(--ink);stroke-width:1}
.wl{stroke:var(--ink);stroke-width:1;fill:none}
.mon{fill:#1f2738;stroke:var(--ink);stroke-width:1}
.bb{fill:var(--card);stroke:var(--ink);stroke-width:1}
.bp{fill:var(--acc);stroke:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<figure>
<div class="art" id="art"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg><svg id="s" role="img" aria-label="your Mac running tophat: connectors fan into memory, memory and the runner read and write each other, the runner acts through its tools; outside, the web client above, the hub, peers and the model provider below"></svg></div>
<figcaption><b>Fig. 4</b>Every connector flows into one memory on your Mac; the runner reads and writes it, calls the model provider, answers you in the web client, and acts out through every tool it has. Memory syncs with the hub and your peers. Dots travel along each connection; hover an icon for its name.</figcaption>
</figure>

    P.bx+=`<path class="ar" d="M${x0} ${y0}L${x1} ${y1}${L(x1,y1,1)}${L(x0,y0,-1).replace(/2\.6/g,'')}"/>`;
    P.bx+=`<path class="ar" d="M${x0+5*Math.cos(a+.5)} ${y0+5*Math.sin(a+.5)}L${x0} ${y0}L${x0+5*Math.cos(a-.5)} ${y0+5*Math.sin(a-.5)}"/>`;};
  const head=(x,y,t,acc,anchor)=>{P.tx+=`<text class="${acc?'ha':'h'}" x="${x}" y="${y}"${anchor?` text-anchor="${anchor}"`:''}>${t}</text>`};

  if(!narrow){
    const cw=Math.min(W,1060),ox=(W-cw)/2;
    const rw=Math.max(190,Math.min(260,cw*.26)),rx0=ox+cw-8-rw; /* actions column */
    const bx0=ox+8,bx1=rx0-26;                                  /* the Mac box */
    const wcH=30,top=6,by0=top+wcH+28,partyH=30,by1=H-8-partyH-28;
    const ch=by1-by0,midY=by0+ch/2;
    P.bx+=`<rect x="${bx0}" y="${by0}" width="${bx1-bx0}" height="${ch}" rx="14" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="1 0"/>`;
    head(bx0+12,by0+16,'your Mac · tophat',true);
    /* inputs: a two-column grid on the left of the box */
    const n=INPUTS.length/2,p=Math.min(36,(ch-34)/(n+.5)),s=Math.round(p*.78),xg=s+8,lx=bx0+16,yo=by0+26+(ch-34-(n+.5)*p)/2;
    const memW=Math.max(70,Math.min(100,(bx1-bx0)*.15)),memH=Math.min(ch*.5,memW*1.25);
    const agW=Math.max(70,Math.min(96,(bx1-bx0)*.14)),agH=agW*.9;
    const free0=lx+xg+s+30,free1=bx1-16,gap=(free1-free0-memW-agW)/3;
    const memX=free0+gap,agX=memX+memW+gap*1.2,memY=midY-memH/2,agY=midY-agH/2;
    memory(memX,memY,memW,memH);runner(agX,agY,agW,agH);
    head(memX+memW/2,memY-7,'memory',true,'middle');head(agX+agW/2,agY-7,'runner',true,'middle');
    both(memX+memW+3,midY,agX-3,midY);
    INPUTS.forEach((k,i)=>{const col=i%2,r=(i-col)/2,x=lx+col*xg,y=yo+r*p+col*p/2;
      P.ic+=ico(k,x,y,s);arc(x+s,y+s/2,memX,memY+8+i*(memH-16)/(INPUTS.length-1),false,3800)});
    /* outside, above: the web client you chat in */
    const wcW=Math.min(150,agW*1.6),wcX=agX+agW/2-wcW/2;
    party(wcX,top,wcW,wcH,'web client');arc(agX+agW/2,agY,wcX+wcW/2,top+wcH,true,2600,true);
    /* outside, below: hub and peers under memory, the model provider under the runner */
    const py=H-8-partyH,hubW=Math.min(70,memW),peerW=34,peersX=memX+memW/2-(hubW+10+2*peerW+8)/2;
    party(peersX,py,hubW,partyH,'hub');
    for(let j=0;j<2;j++)party(peersX+hubW+10+j*(peerW+8),py,peerW,partyH,'peer'.slice(0,j?4:4));
    arc(memX+memW*.35,memY+memH,peersX+hubW/2,py,true,3000,true);
    arc(memX+memW*.65,memY+memH,peersX+hubW+10+peerW/2,py,true,3300,true);
    const mpW=Math.min(150,agW*1.7),mpX=agX+agW/2-mpW/2;
    party(mpX,py,mpW,partyH,'model provider');arc(agX+agW/2,agY+agH,mpX+mpW/2,py,true,2400,true);
    /* actions: the column on the right */
    head(rx0,by0-10,'actions');
    const wts=[1.7,1.6,1.35,...SMALL.map(()=>.78)],sum=wts.reduce((a,b)=>a+b,0),illW=66;
    let y=by0;
    wts.forEach((wt,i)=>{
      const rh=ch*wt/sum,cy=y+rh/2;y+=rh;
      const sy=agY+10+i*(agH-20)/(wts.length-1);
      if(i<3){const sc=Math.min(1,(rh-6)/54),w=72*sc,h=54*sc;
        P.ic+=`<g transform="translate(${rx0+(illW-w)/2} ${cy-h/2}) scale(${sc})">${ART[HEAD[i][0]]()}</g>`;
        const nn=Math.floor((rw-illW-8)/6.5);
        P.tx+=lines(HEAD[i][1],rx0+illW+8,cy-(wrap(HEAD[i][1],nn).length-1)*6+3.5,nn,12.5);
        arc(agX+agW,sy,rx0-4,cy,false,3200)}
      else{const k=SMALL[i-3],is=Math.min(22,rh-4);
        P.ic+=ico(k,rx0+(illW-is)/2,cy-is/2,is);
        P.tx+=`<text class="d" x="${rx0+illW+8}" y="${cy+3.5}">${SMALLTXT[k]}</text>`;
        arc(agX+agW,sy,rx0+(illW-is)/2-4,cy,false,3200)}
    });
  }else{
    /* phone: the same picture stacked: web client, the Mac box (inputs over memory and runner), actions, then hub, peers and provider */
    const pad=10,top=4,wcH=26;
    const bx0=pad,bx1=W-pad,by0=top+wcH+22;
    const n=INPUTS.length/2,p=Math.min(34,(W-2*pad-24)/(n+.5)),s=Math.round(p*.74),tw=(n-1)*p+p/2+s,x0=(W-tw)/2;
    const r1=by0+24,r2=r1+s+4;
    const memW=Math.max(80,Math.min(104,W*.26)),agW=Math.max(64,Math.min(84,W*.2)),boxH=60,gapX=Math.min(70,W*.14);
    const mx=(W-(memW+gapX+agW))/2,ax=mx+memW+gapX,my=r2+s+34;
    const ah=46,colW=(bx1-bx0-12)/3,oy=my+boxH+40,lblY=oy+ah+12,by1=lblY+26;
    P.bx+=`<rect x="${bx0}" y="${by0}" width="${bx1-bx0}" height="${by1-by0}" rx="12" fill="none" stroke="var(--ink)" stroke-width="1.2"/>`;
    head(bx0+10,by0+14,'your Mac · tophat',true);
    memory(mx,my,memW,boxH);runner(ax,my+(boxH-agW*.8)/2,agW,agW*.8);both(mx+memW+3,my+boxH/2,ax-3,my+boxH/2);
    head(mx+memW/2,my-6,'memory',true,'middle');head(ax+agW/2,my-6,'runner',true,'middle');
    INPUTS.forEach((k,i)=>{const row=i%2,c=(i-row)/2,x=x0+c*p+row*p/2,y=row?r2:r1;
      P.ic+=ico(k,x,y,s);arc(x+s/2,y+s,mx+10+i*(memW-20)/(INPUTS.length-1),my,true,3800)});
    const wcW=120;party(ax+agW/2-wcW/2,top,wcW,wcH,'web client');arc(ax+agW/2,my+(boxH-agW*.8)/2,ax+agW/2,top+wcH,true,2600,true);
    ['browser','mac','chat'].forEach((a,i)=>{const cx=bx0+6+colW*(i+.5),sc=.85;
      P.ic+=`<g transform="translate(${cx-36*sc} ${oy}) scale(${sc})">${ART[a]()}</g>`;
      P.tx+=`<text style="font-size:9px" x="${cx}" y="${lblY}" text-anchor="middle">${['browser use','macOS use','posting'][i]}</text>`;
      arc(ax+agW*(.3+.2*i),my+(boxH+agW*.8)/2,cx,oy-3,true,3200)});
    const py=by1+26,ph=26,hubW=58,peerW=40,mpW=Math.min(140,W*.38);
    party(pad+4,py,hubW,ph,'hub');party(pad+4+hubW+8,py,peerW,ph,'peer');
    party(bx1-4-mpW,py,mpW,ph,'model provider');
    arc(mx+memW*.3,my+boxH,pad+4+hubW/2,py,true,3000,true);
    arc(mx+memW*.6,my+boxH,pad+4+hubW+8+peerW/2,py,true,3300,true);
    arc(ax+agW*.8,my+(boxH+agW*.8)/2,bx1-4-mpW/2,py,true,2400,true);
    head(pad+2,oy-8,'actions');
  }
  svg.innerHTML=P.arc+'<g id="pk"></g>'+P.bx+P.ic+P.tx;
  const paths=[...svg.querySelectorAll('path.arc')],pk=svg.querySelector('#pk');
  paths.forEach((el,i)=>{const c=document.createElementNS(NS,'circle');c.setAttribute('r','2.4');c.setAttribute('class','pk');pk.appendChild(c);
    packets.push({el,c,len:el.getTotalLength(),dur:arcs[i].dur,back:arcs[i].back,ph:(i*.6180339)%1})});
  if(reduce){packets.forEach(k=>place(k,.5));return}
  const loop=now=>{for(const k of packets)place(k,((now/k.dur)+k.ph)%1);raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
}
function place(k,t){const u=k.back?1-t:t,pt=k.el.getPointAtLength(u*k.len);k.c.setAttribute('cx',pt.x);k.c.setAttribute('cy',pt.y);k.c.setAttribute('opacity',Math.sin(t*Math.PI).toFixed(2))}
build();new ResizeObserver(()=>build()).observe(svg);
</script></body></html>
