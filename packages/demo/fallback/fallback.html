<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--head-->
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* white, with the new rose scheme for highlights only: deep #b45c6e (links, accents, rose text on white), light #e6a0a6, mid #dba9b3 */
:root{color-scheme:light;--bg:#fff;--ink:#1c1b19;--dim:#77736a;--line:#e9e6dd;--rose:#b45c6e;--rose-lt:#e6a0a6;--rose-md:#dba9b3}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink)}
body{margin:0;padding:clamp(28px,7vw,80px) 18px 96px;font:15px/1.65 ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
::selection{background:rgba(230,160,166,.45)}
main{max-width:1040px;margin:0 auto}
main p,main h1,main h2{max-width:74ch}
h1{font:inherit;font-weight:400;font-size:1.3em;margin:0 0 .5em}
h1 b{color:var(--rose);font-weight:700}
p{margin:0}
.sub{color:var(--dim);margin-bottom:2.6em}
ul.sub{margin:0 0 1em;padding-left:2ch}
.intro p{margin:0 0 1em}
.intro{margin-bottom:1.4em}
h2{font:inherit;font-weight:700;margin:0 0 .7em}
h3{font:inherit;font-weight:700;color:var(--rose);margin:1.6em 0 0}
a{color:var(--rose);text-decoration-color:var(--rose-lt);text-underline-offset:3px}
a:hover{text-decoration-color:var(--rose)}
em{font-style:italic}

/* the boxes: native details, so they open without script; closed, each is its one heading line */
.boxes{margin:0 0 3em;border-top:1px solid var(--line)}
.box{border-bottom:1px solid var(--line)}
summary{display:grid;grid-template-columns:3ch minmax(0,1fr) 2ch;gap:1ch;align-items:baseline;padding:13px 4px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.n{color:var(--rose);font-weight:700}
.line{font-weight:700;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box[open] .line{white-space:normal}
summary:hover .line{color:var(--rose)}
summary:focus-visible{outline:2px solid var(--rose);outline-offset:-2px}
.tog{text-align:right;color:var(--rose)}
.tog::before{content:"+"}
.box[open] .tog::before{content:"\2212"}
.more{padding:0 4px 22px calc(4ch + 4px)}
.more>*{margin-top:1em}
.more>p:first-child{margin-top:0}
.more b{color:var(--rose)}

/* the live answer's own figures, each with its shared figcaption inside the frame */
iframe.w{display:block;width:100%;height:440px;border:1px solid var(--line);background:#fbfaf6}
iframe.w-memory-bench{height:auto;aspect-ratio:1.85}
iframe.w-runner-qol{height:560px}
iframe.w-mac-desktop{height:auto;aspect-ratio:1.45}
img.shot{display:block;width:100%;max-width:420px;height:auto;border:1px solid var(--line)}
@media (max-width:640px){
  body{font-size:14px}
  .more{padding-left:4px}
  iframe.w{height:480px}
  iframe.w-runner-qol{height:620px}
  iframe.w-mac-desktop{height:auto;aspect-ratio:1}
}
/* the memory figure stacks its two plots below 638px of frame (each plot keeps its 312px width): one fixed height for the stack */
@media (max-width:674px){iframe.w-memory-bench{height:660px;aspect-ratio:auto}}

.code{position:relative;border:1px solid var(--line);border-left:3px solid var(--rose);margin-top:.6em;max-width:94ch}
pre{margin:0;padding:12px 70px 12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.93em}
button{position:absolute;top:8px;right:8px;font:inherit;font-size:.8em;color:var(--rose);background:var(--bg);border:1px solid var(--rose-md);padding:2px 9px;cursor:pointer}
button:hover{border-color:var(--rose)}
</style>
</head>
<body>
<main>
<!--lead-->
<div class="intro">
<!--intro-->
</div>
<div class="boxes">
<!--boxes-->
</div>
<!--install-->
</main>
<script>addEventListener('message',function(e){var d=e.data;if(!d||d.tophatFigure!=='height')return;var px=Math.round(+d.px);if(!(px>=60&&px<=3000))return;document.querySelectorAll('iframe.w-runner-qol').forEach(function(f){if(f.contentWindow===e.source)f.style.height=px+2+'px'})});</script>
<script>
document.querySelectorAll('.code').forEach(function(c){var p=c.querySelector('pre');if(!p)return;var b=document.createElement('button');b.type='button';b.textContent='copy';b.onclick=function(){var t=p.textContent;var done=function(){b.textContent='copied';setTimeout(function(){b.textContent='copy'},1200)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){})}else{var r=document.createRange();r.selectNodeContents(p);var s=getSelection();s.removeAllRanges();s.addRange(r)}};c.appendChild(b)});
</script>
</body>
</html>
