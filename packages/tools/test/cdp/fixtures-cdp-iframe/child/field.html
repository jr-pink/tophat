<!doctype html>
<html>
<head><meta charset="utf-8"><title>field</title>
<style>html,body{margin:0;font:14px -apple-system,sans-serif}input{width:98%;height:28px;box-sizing:border-box;border:0;outline:none}</style>
</head>
<body>
<input id="field" type="text" autocomplete="off" pattern="[0-9\s]*">
<script>
  // Three copies of THIS page are embedded with a byte-identical src, which is
  // the collision that made `url=` useless on the Shopify checkout. window.name
  // comes from the embedding <iframe name=...>, so a test can prove which one
  // it actually reached.
  const input = document.getElementById('field');
  const who = window.name || 'field';
  document.title = 'field:' + who;
  const publish = () => parent.postMessage({ type: 'field', name: who, value: input.value, valid: true }, '*');
  input.addEventListener('input', publish);
  window.__who = who;
  publish();
</script>
</body>
</html>
